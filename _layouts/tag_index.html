---
layout: page
---

<style>
.tag {
  background-color: var(--highlight-color);
  color: var(--inverted-font-color);
  font-size: 0.8em;
  font-family: "Mulish", sans-serif;
  padding: 2px 5px;
  margin: 5px;
  border: 0.5pt solid var(--emph);
  border-radius: 8px;
  cursor: pointer;
}

.tag a {
  color: var(--inverted-font-color);
}

.tag.active {
  background-color: var(--header);
}

.tag.active a {
  color: var(--highlight-color);
}
</style>

<div style="display: inline-block;">
  <span class="tag">
  <a href="{{site.baseurl}}/posts">
    &larr; all
  </a>
  </span>
</div>

<ul>
  {% for post in site.posts %}
  {% for tag in post.tags %}
  {% if tag == page.tag and post.unlisted != true %}
  <li>
    <p>
      <a href="{{post.url}}">{{post.title}}</a> <span class="sub">{{ post.date | date: "%b %d, %Y" }} ({{ post.content | number_of_words }} words)</span>
    </p>
  </li>
  {% endif %}
  {% endfor %}
  {% endfor %}
</ul>
