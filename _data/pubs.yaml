- id: 'sigcse2027hcpo'
  type: 'c'
  topics:
    - social learning
  title: 'Human-Centered Process-Oriented Intro to Programming (to appear)'
  pub_title: "ACM Technical Symposium on Computer Science Education&mdash;Experience Reports"
  venue: "SIGCSE"
  authors: "A. G. Soosai Raj, <b>A. M. Kazerouni</b>, L. Perlmutter, A. Chao, H. Li, K. Ma, A. Nazzal, M. Kallia"
  date: '2027-02'
  pdf: 'sigcse2027hcpo.pdf'
  doi: 'https://doi.org/10.1145/3857222.3860223'
  abstract: |
    The rise of Generative Artificial Intelligence (GenAI) has fundamentally changed the pedagogy of introductory programming. When students use GenAI to generate code for automated grading pipelines, learning often becomes transactional (i.e., solution-oriented exchange) where the final product is prioritized over the human effort required to learn. The context of this work is an intro course that one author taught, and other authors contributed to the course design. Before changes to our course, assignments were primarily auto-graded, and students began treating them as hurdles to be cleared. Students disengaged, learning communities eroded, and failure rates on exams increased despite students having near-perfect homework scores. In response, we redesigned our CS1 course to be Human-Centered and Process-Oriented refocusing on the human journey of learning and problem-solving. To restore social interactions in our course, we integrated social learning through TA-facilitated study groups. To restore authentic engagement with the course material, we replaced autograded programming assignments with collaborative, manually graded homework assignments with significant handwritten components. For code-writing tasks, students maintained process journals to document their problem-solving journey, including errors encountered and help sought. Preliminary results suggest this approach rebuilt social interactions and restored authentic student engagement. We observed a moderate-to-strong positive correlation between homework scores and exam scores. By replacing machine-led solution-oriented interactions with our human-centered process-oriented approach, we provide a rigorous and meaningful path for introductory programming in the age of GenAI.

- id: 'koli2026process-journals'
  type: 'c'
  topics:
    - social learning
    - self-regulation in programming
  award: "Honorable Mention"
  title: "Beyond the Final Code: Understanding Student Programming Behaviors through Process Journals"
  pub_title: "Koli Calling International Conference on Computing Education Research&mdash;Full Research Paper"
  venue: "Koli Calling"
  authors: "A. Chao, H. Li, K. Ma, A. Nazzal, <b>A. M. Kazerouni</b>, L. Perlmutter, A. G. Soosai Raj"
  date: '2026-11'
  pdf: 'koli2026process-journals.pdf'
  doi: 'https://doi.org/10.1145/3856208.3856238'
  abstract: |
    As students can now use Generative AI to instantly solve introductory programming problems, there is a greater need to focus pedagogy on the programming process, not just the final product. We study process journals, in which students document their problem-solving steps and reflections while working on a coding problem as a way to make their thinking visible to instructors.  We qualitatively analyzed 48 process journals from an introductory programming course to understand student behaviors and interpret these behaviors through the theoretical lens of self-regulation. Our findings revealed ways in which students understand and approach the programming task, how they test and debug their code, how they consulted resources, and how they reflected or managed their learning. We classified these behaviors as positive, negative, or neutral.  Student engagement with the process journal varied. Although some showed a high level of engagement with the process journal and demonstrated thinking beyond solving the problem, others were not able to complete the basic requirements or showed little extra engagement after satisfying those requirements. In addition, we found that the behaviors students showed were not strongly related to their exam score or their self-reported metacognitive self-regulation metric. Our study presents process journals as a tool that can give educators insight into both desirable and undesirable behaviors of the stages students go through when solving programming problems.  This allows educators to stage interventions that support student learning and metacognitive development.

- id: 'eduvis2026inkling'
  type: 'w'
  topics:
    - data visualization
  title: '<span style="font-variant: small-caps">Inkling</span>: Exploring How Students Design Visualizations with Integrated Sketching, Natural Language, and Code Editing (to appear)'
  pub_title: '4th IEEE VIS Workshop on Visualization Education, Literacy, and Activities'
  venue: 'EduVis'
  authors: 'S. M. Fisher, A. P. Wright, <b>A. M. Kazerouni</b>'
  date: '2026-11'
  pdf: 'eduvis2026inkling.pdf'
  links:
    code: "https://github.com/Cal-Poly-Human-Centered-Computing/inkling"
  abstract: |
    Visualization authors can use a number of tools to design and author data graphics, including those with alternative input modalities. For example, sketching is useful for exploring ideas, natural language for expressing intents that are not easily visually expressible, and direct code editing for precise refinement. Prior work exploring these modalities has tended to one modality at a time. However, a data visualization designer may benefit from the ability to fluidly move between modalities for different stages of the design process. We present <span style="font-variant: small-caps">Inkling</span>, a prototype multimodal editor for data visualization in which users can combine sketching, natural language instructions, and direct code editing to design visualizations that are bound to their data. We conducted pilot user studies with six visualization novices to gain an initial insight into how they used the three modalities to complete assigned visualization tasks. This work is meant to inform further larger-scale empirical studies into the effectiveness of multimodal visualization editing. Our qualitative analysis of screen recordings and audio transcriptions revealed consistent patterns of usage of the three interaction modes.

- id: 'iticse2026peer-collaboration'
  type: 'c'
  topics:
    - social learning
    - help-seeking
  title: 'Peer Networks and Instructor Resources as Complementary Support Systems in Six CS Classrooms'
  pub_title: 'ACM Conference on Innovation and Technology in Computer Science Education&mdash;Research Track'
  venue: 'ITiCSE'
  authors: "N. Ravetch, N. Nayman, J. Herberger, T. Migler, <b>A. M. Kazerouni</b>"
  date: '2026-07'
  pdf: 'iticse2026peer-collaboration.pdf'
  doi: 'https://doi.org/10.1145/3803400.3809329'
  links:
    blog: '/blog/peer-collaboration-networks'
    code: 'https://github.com/computing-ed-cal-poly/peer-networks/'
  abstract: |
    Peer collaboration is important for academic success, and may provide benefits to students in the form of advice, information, and positive expectations. This paper explores the peer collaboration networks that formed in six undergraduate computing classrooms along with students’ usage of instructor office hours and the online class forum. We used survey responses from 166 students to construct collaboration networks and analyzed them using statistical hypothesis testing and methods from social network analysis. We found that men were more likely than women to be isolated, and that isolation had a significant negative relationship with academic performance. Finally, we observed that students who were isolated <i>and</i> made no use of instructor help sources performed dramatically worse on a final assessment than students who either had collaborators or made use of instructor resources, suggesting that peers and the instructor acted as complementary academic support systems. Interventions to emphasize social learning and to identify at-risk isolated students may help improve outcomes for students at the margins.

- id: 'koli2025topic-choices'
  type: 'c'
  topics:
    - socially responsible computing
  title: "What Topic Domains Interest Students in Socially Responsible Computing Coursework?"
  pub_title: 'Koli Calling International Conference on Computing Education Research&mdash;Short Empirical Paper'
  venue: 'Koli Calling'
  authors: <b>A. M. Kazerouni</b>, Z. Agha, A. Hubbard Cheuoua, M. Lee, J. Lehr, I. Yoon, Z. Wood
  date: '2025-11'
  pdf: 'koli2025topic-choices.pdf'
  doi: 'https://doi.org/10.1145/3769994.3770030'
  links:
    blog: '/blog/what-topics-interest-students'
  abstract: |
    Students tend to be interested in and motivated by applications of computing that further the social good (e.g., they would rather develop a game for learning sign language than a chess game). Several studies have positioned humanitarian contexts and socially responsible computing as a "hook" to broaden participation in computing. Within this context, we seek to learn the topic domains that students find most interesting for computing coursework. Our longer-term objective is to design curricular materials that center student voice and choice, with the ultimate goal of broadening and sustaining participation in computing. We gathered data about students' interests from three sources: a survey about student interests administered in CS courses at six post-secondary institutions (<i>N</i>=1443), students' actual topic choices in an open-ended data-centric assignment (<i>N</i>=87), and focus group interviews (<i>N</i>=6). These data are primarily derived from computing majors enrolled in early courses, with some upper division courses represented as well. Evidence from survey responses and actual project choices suggested that students consistently found five domains to be of interest: education, the environment, health, community engagement, and economic development, with little difference in terms of gender identities. Surveys and focus group interviews also suggested that students were interested in coursework focused on artificial intelligence and online security and privacy. Given the broad number of categories we encountered, our results emphasize the importance of letting students choose topic domains themselves whenever possible. When student-chosen topics are not possible, we recommend designing curricular materials in these "top five" domains.

- id: 'toce2025src'
  type: 'j'
  topics:
    - socially responsible computing
    - introductory programming
  title: "The Benefits of Socially Responsible Computing in Early Computing Courses: A Multi-Institutional Study at Primarily Undergraduate Hispanic-Serving Institutions"
  pub_title: ACM Transactions on Computing Education
  venue: "TOCE"
  authors: "<b>A. M. Kazerouni</b>, M. Lee, A. Hubbard Cheuoua, A. Gautam, S. Hooshmand, P. S. Inventado, E. E. Kang, J. Lehr, Y. Sun, K. A. Wortman, I. Yoon, Z, Wood"
  doi: "https://doi.org/10.1145/3727988"
  links:
    blog: "/blog/src-in-early-cs-courses/"
    slides: "assets/slides/src-in-early-cs-courses.pdf"
  date: '2025-04'
  pdf: "toce2025src.pdf"
  abstract: |
    <br/><b>Background and Context.</b> Computing is considered a fundamental skill for civic engagement, self-expression, and employment opportunity. Despite this, in our state in the USA, there are significant equity gaps in post-secondary computing enrollment and retention. Specifically, in the California State University system (CSU), which serves close to half a million undergraduate students, students identifying as Hispanic/Latino make up a smaller percentage of CS majors than expected from the state's overall population; and, once enrolled, tend to leave the CS major at higher rates than other students.<br/>
    <b>Purpose.</b> We report on the impacts of a curricular intervention aimed at strengthening the sense of belonging of Hispanic/Latino students in computing, with the eventual goal of improving retention in computing majors for those students.<br/>
    <b>Methods.</b> Working in an alliance of six universities within the CSU (five of which are designated as Hispanic-Serving Institutions), we have incorporated socially responsible computing across early CS courses. We aim for alignment between our curriculum and students' communal goal orientations, and for coursework that attends to students' interests, values, and cultural assets. Over a two-year-long study, we collected survey data to learn about the impact of our curricular intervention on students' sense of belonging and perceived learning and agency.<br/>
    <b>Findings.</b> We found that students generally reported high communal goal orientations and, at the campuses <i>without</i> competitive enrollment policies, our intervention had a significant positive impact on students' senses of belonging. This effect was observed between control and treatment terms as well as within treatment terms. We also note that Hispanic/Latino students were more likely than other students to report that non-curricular factors like work and family obligations interfered with their learning, and appeared to experience slightly stronger benefits from the intervention.<br/>
    <b>Implications.</b> Our data suggest positive outcomes for integrating socially responsible computing into early CS courses, especially for Hispanic/Latino students at certain primarily-undergraduate institutions (PUIs).  Unlike much prior research, we found that conducting studies outside of primarily white institutions (PWIs) can provide new insights into the impact of curricular interventions on student experience and retention. Our varying results by campus suggest that factors such as campus population, acceptance rate, and departmental enrollment policies ought to also be taken into account in studies that aim to broaden participation in computing. Would results from prior research on recruitment and retention of Hispanic/Latino students or other underrepresented students look different if such studies were replicated at institutions with different demographics and enrollment policies?


- id: 'sigcse2025src'
  type: 'c'
  topics:
    - socially responsible computing
    - introductory programming
  title: "Reflecting on Practices to Integrate Socially Responsible Computing in Introductory Computer Science Courses"
  pub_title: ACM Technical Symposium on Computer Science Education&mdash;Experience Reports
  venue: "SIGCSE"
  authors: "K. Wortman, A. Gautam, S. Hug, P. S. Inventado, <b>A. M. Kazerouni</b>, J. Lehr, K. Sood, Z. Wood"
  date: '2025-02'
  links:
    blog: "/blog/src-in-early-cs-courses/"
  doi: "https://doi.org/10.1145/3641554.3701962"
  pdf: "sigcse2025src-practices.pdf"
  abstract: |
    Socially Responsible Computing (SRC) education entails the infusion of Computer Science (CS) education with interwoven attention to ethical, social, and political issues to position students to reflect and take action individually and collaboratively to create a more just world. Our approach to SRC supports students to explore computing design/development in early CS courses with a communal goal orientation (in contrast to agentic/individualized), shown to improve achievement and retention for students with identities that are minoritized in CS. Grounded in our own experiences as co-developers and implementers of this pedagogical transformation and as co-facilitators of a Faculty Learning Community (FLC), we present a set of best practices for incorporating SRC into introductory CS courses: 1) choose the domain mindfully; 2) design for synergy with technical material; 3) scaffold for inclusivity; 4) structure with a framework; 5) avoid othering SRC elements; and 6) reuse and build on existing resources. We share how these best practices guide our efforts; how they can address challenges and concerns for new and continuing SRC implementers; and the ways in which we have and will continue to test and co-design this approach.


- id: 'jce2024end-user-programming'
  type: 'j'
  topics:
    - end-user programming
  title: "Recommendations for Improving End-User Programming Education: A Case Study with Undergraduate Chemistry Students"
  pub_title: ACS Journal of Chemical Education
  venue: "J Chem Ed"
  authors: "W. Fuchs, A. McDonald, A. Gautam, <b>A. M. Kazerouni</b>"
  date: '2024-06'
  doi: 'https://doi.org/10.1021/acs.jchemed.4c00219'
  links:
    blog: "/blog/end-user-programming"
  abstract: |
    Programming is widespread in multiple domains and is being integrated into various discipline-specific university courses where, like students in a typical CS 1 course, students from other disciplines face challenges with learning to program. We offer a case study in which we study undergraduate students majoring in either Chemistry or Biochemistry as they learn programming in a Physical Chemistry course sequence. Using surveys and think-aloud sessions with students, we conducted a thematic content analysis to explain the challenges they face in this endeavor. We found that students struggled to transfer their programming knowledge to new representations and problems, and they did not have strategies in place for solving problems with programming. These facts combine to lower students' confidence in their programming ability, making it less likely that they will reach for computing to help solve domain-specific problems. We recommend that students in end-user programming contexts be explicitly taught the skills of abstraction, decomposition, and meta-cognitive awareness as they pertain to programming.
  pdf: "jce2024end-user-programming.pdf"

- id: 'toce2023testing'
  type: 'j'
  topics:
    - software testing
  title: A Model of How Students Engineer Test Cases With Feedback
  pub_title: ACM Transactions on Computing Education
  venue: "TOCE"
  authors: "A. M. Shin, <b>A. M. Kazerouni</b>"
  pdf: 'toce2023testing.pdf'
  date: '2024-01'
  doi: "https://doi.org/10.1145/3628604"
  links:
    blog: "/blog/test-feedback-sensemaking"
  abstract: |
    <br><b>Background and Context.</b>
    Students' programming projects are often assessed on the basis of their tests as well as their implementations, most commonly using test adequacy criteria like branch coverage, or, in some cases, mutation analysis.
    As a result, students are implicitly encouraged to use these tools during their development process (i.e., so they have awareness of the strength of their own test suites).<br>
    <b>Objectives.</b>
    Little is known about how students choose test cases for their software while being guided by these feedback mechanisms.
    We aim to explore the interaction between students and commonly used testing feedback mechanisms (in this case, branch coverage and mutation-based feedback).<br>
    <b>Method.</b>
    We use grounded theory to explore this interaction.
    We conducted 12 think-aloud interviews with students as they were asked to complete a series of software testing tasks, each of which involved a different feedback mechanism.
    Interviews were recorded and transcripts were analyzed, and we present the overarching themes that emerged from our analysis.<br>
    <b>Findings.</b>
    Our findings are organized into a process model describing how students completed software testing tasks while being guided by a test adequacy criterion.
    Program comprehension strategies were commonly employed to reason about feedback and devise test cases.
    Mutation-based feedback tended to be cognitively overwhelming for students, and they resorted to weaker heuristics in order to address this feedback.<br>
    <b>Implications.</b>
    In the presence of testing feedback, students did not appear to consider <i>problem coverage</i> as a testing goal so much as <i>program coverage</i>.
    While test adequacy criteria can be useful for <i>assessment</i> of software tests, we must consider whether they represent good goals for testing, and if our current methods of practice and assessment are encouraging poor testing habits.

- id: 'asee2024bpc-src'
  type: 'c'
  topics:
    - socially responsible computing
  title: "Socially Responsible Computing: Promoting Latinx Student Retention Via Community Engagement in Early Computer Science Courses"
  pub_title: "ASEE Annual Conference and Exposition—NSF Grantees Poster Session"
  venue: "ASEE"
  authors: "D. M. Krum, Z. Wood, E. Kang, <b>A. M. Kazerouni</b>, J. L. Lehr, S. Hug, P. S. B. Inventado, F. Tang, I. Yoon, A. Kulkarni, Y. Sun, M. Beheshti, A. Gautam, A. Hubbard Cheuoua, S. Hooshmand, K. A. Wortman"
  date: '2024-06'
  links:
    blog: "/blog/src-in-early-cs-courses/"
  abstract: |
    With the support of the NSF Broadening Participation in Computing program, the Socially Responsible Computing (SRC) alliance is committed to transforming early computing experience to motivate and engage historically marginalized students to pursue computing. This alliance, of six public universities, collectively serves over two thousand computing students who identify as Hispanic/Latino (Latinx). Unfortunately, Latinx students face a higher attrition rate across these campuses compared to non-Latinx students (34.6% versus 21.5%), especially during the first two years of computing journey. The primary goal of our alliance is to change this trend and broaden participation in computing. Specifically, we aim to create and deploy curriculum in the early Computer Sciences courses that demonstrate the value of computing to help society, which will provide students with the opportunity to see the alignment of their communal goals with computing and opportunities to bring their own cultural assets into the computing classroom. This includes students’ community-based knowledge or skills, general communication skills, and their skills related to teamwork and community engagement. We believe this framework will foster student’s sense of belonging, motivation, and engagement in computing. To achieve our goal of improve retention of Latinx students, the alliance has set four specific objectives.<br><br>
    O1: Designing and bringing curricular and pedagogical changes in the two earliest computing courses that integrate considerations of social responsibility into computing assignments.<br>
    O2: Introducing a new intervention in computing courses that focuses on creating a different kind of student experience focused on community driven computing projects.<br>
    O3: Building faculty learning communities to help train, orient and support instructors of this curriculum.<br>
    O4: Employing a cross site collaboration structure using a collective impact model, allowing variance for each site while working towards a common goal<br><br>
    Our alliance brings together six campuses, each with unique strengths and local challenges. We use a collective impact model, allowing each campus to contribute to the development, deployment, and continuous improvement the curriculum. Our team is composed of computer science educators and social scientists with expertise in evaluating inclusive STEM education and training faculty at Hispanic-Serving Institutions (HSIs). Our evaluation plan examines both student and faculty outcomes, enabling us to reflect and refine our approach. Shared leadership and site teams are integral to sustaining our work, even amid potential academic personnel changes.<br><br>
    Our research is impactful in the learning sciences for several reasons. It utilizes faculty learning communities as a vehicle to bring change to the climate and curriculum of computing education. Furthermore, this project holds the potential to develop a broadly applicable introductory curriculum that is designed, deployed, and evaluated across a range of public education institutions serving the diverse state of [State-Name]. We aim for the success of this alliance to extend to all other sister campuses, potentially reaching tens of thousands of computing students. This curriculum will also be broadly deployed nationwide to help marginalized students pursue computing.<br><br>
    Despite being in the initial year of the project, we have achieved significant results in terms of instructor skill gains and attitudes. We are poised to make a meaningful impact on students as we have begun introducing new curricular and pedagogical changes. In this paper, we will share our current progress and core activities related to each objective, which include establishing a supportive alliance structure, developing new computing curriculum that includes a socially responsible component at each site, creating the structure and content for the first faculty learning community (FLC), and implementing the collective impact model. In addition, we will also share survey data, including feedback from both students and instructors, and lessons learned during the first-year implementation.
  pdf: 'asee2024bpc-src.pdf'
  doi: 'https://peer.asee.org/46968'

- id: 'sigcse2024cs0-course'
  type: 'c'
  topics:
    - socially responsible computing
    - introductory programming
  title: 'Community Action Computing: A Data-centric CS0 Course'
  pub_title: ACM Technical Symposium on Computer Science Education&mdash;Curricular Initiatives
  venue: "SIGCSE"
  authors: '<b>A. M. Kazerouni</b>, J. Lehr, Z. Wood'
  pdf: 'sigcse2024cs0.pdf'
  date: '2024-03'
  doi: "https://doi.org/10.1145/3626252.3630807"
  links:
    slides: 'assets/slides/cs0-sigcse2024-slides.pdf'
    blog: "/blog/src-in-early-cs-courses/"
    course: "/courses/csc123"
  abstract: |
    A student's sense of belonging in computing can be positively impacted when coursework can authentically be connected to real community contexts. We describe the design, materials, and preliminary evaluation of an introductory programming (CS0) course infused with a focus on societal responsibility and relevance. We take a data-centric, constructionist approach to introductory computing. Data-centricity allows us to authentically connect coursework with students' communal and societal interests, and students' motivation was enhanced given that they were creating and sharing artifacts as part of their coursework. Students used TypeScript to manipulate and analyze real data-sets, and created shareable websites containing statistics, data visualizations, and reflections based on the data-set of their choosing. Students chose varied topics for their assignments---they worked with data about access to CS education, climate change, and data provided by local non-profit organizations. A preliminary evaluation indicated that students who took this CS0 course attained CS-specific learning objectives equally well in the two subsequent follow-on courses as students who took alternative CS0 courses at our University. We close with instructor perspectives and reflections on lessons learned.

- id: 'sigcse2023debugging'
  type: 'c'
  title: Exploring the Impact of Cognitive Awareness Scaffolding for Debugging in an Introductory Computer Science Class
  pub_title: ACM Technical Symposium on Computer Science Education&mdash;Experience Reports
  venue: "SIGCSE"
  authors: 'J. Lee, <b>A. M. Kazerouni</b>, C. Siu, T. Migler'
  pdf: 'sigcse2023debugging.pdf'
  doi: 'https://doi.org/10.1145/3545945.3569871'
  date: '2023-03'
  topics:
    - self-regulation in programming
    - debugging
  abstract: |
    Debugging involves the simultaneous application of a number of programming skills&mdash;reading code, writing code, problem comprehension, etc. This makes it a challenging activity for novice programmers. Unfortunately, debugging is rarely taught explicitly in introductory programming courses, and is often learned as an implicit goal through programming assignments. In this experience report we explore the impact of a cognitive awareness scaffold to help students monitor their progress as they debug their code. We created a simple form that students used to document their debugging process when they ran into bugs. The form asks questions that students are likely to be asked by course staff during office hours, e.g., ``What have you tried so far?''. This act of verbalizing errors and enumerating successful and unsuccessful strategies to fix them is meant to help students monitor their own debugging progress. We examined the cognitive awareness demonstrated in form responses, finding that responses were more superficial on projects of higher difficulty. Additionally, we gave students an exit survey to measure the perceived impact of the debugging form on students' ability to regulate their debugging process and their confidence while debugging. Students indicated that the form helped them better verbalize errors in their programs, and helped them surmount problems with which they would otherwise have needed help.

- id: 'koli2021help-seeking'
  type: 'c'
  topics:
    - help-seeking
    - social learning
  title: Patterns of Academic Help-Seeking in Undergraduate Computing Students
  pub_title: 'Koli Calling International Conference on Computing Education Research'
  venue: "Koli Calling"
  authors: 'A. Doebling, <b>A. M. Kazerouni</b>'
  date: '2021-11'
  doi: 'https://doi.org/10.1145/3488042.3488052'
  pdf: 'koli2021help-seeking.pdf'
  abstract: |
    Knowing when and how to seek academic help is crucial to the success of undergraduate computing students. While individual help-seeking resources have been studied, little is understood about the factors influencing students to use or avoid certain resources. Understanding students' patterns of help-seeking can help identify factors contributing to utilization or avoidance of help resources by different groups, an important step toward improving the quality of resources. We present a mixed-methods study investigating the help-seeking behavior of undergraduate computing students. We collected survey data (n=138) about students' frequency of using several resources followed by one-on-one student interviews (n=15) to better understand <i>why</i> they use those resources. Several notable patterns were found. Women sought help in office hours more frequently then men did and computing majors sought help from their peers more often than non-computing majors. Additionally, interview data revealed a common progression in which students started from easily accessible but low utility resources (online sources and peers) before moving on to less easily accessible, high utility resources (like instructor office hours).
  # blog: 'https://medium.com/@ayaankazerouni/what-makes-cs-students-seek-or-avoid-academic-help-ce5b1651041a'
  links:
    blog: 'blog/help-seeking-behaviours'

- id: 'jss2021mutation'
  type: 'j'
  topics:
    - software testing
  title: Fast and Accurate Incremental Feedback for Students' Software Tests Using Selective Mutation Analysis
  pub_title: 'Journal of Systems and Software, Volume 175'
  venue: "JSS"
  authors: '<b>A. M. Kazerouni</b>, J. C. Davis, A. Basak, C. A. Shaffer, F. Servant, S. H. Edwards'
  pdf: 'jss2021mutation-testing.pdf'
  doi: 'https://doi.org/10.1016/j.jss.2021.110905'
  date: '2021-01'
  abstract: |
    As incorporating software testing into programming assignments becomes routine, educators have begun to assess not only the correctness of students' software, but also the adequacy of their tests. In practice, educators rely on code coverage measures, though its shortcomings are widely known. Mutation analysis is a stronger measure of test adequacy, but it is too costly to be applied beyond the small programs developed in introductory programming courses. We demonstrate how to adapt mutation analysis to provide rapid automated feedback on software tests for complex projects in large programming courses. We study a dataset of 1389 student software projects ranging from trivial to complex. We begin by showing that although the state-of-the-art in mutation analysis is practical for providing rapid feedback on projects in introductory courses, it is prohibitively expensive for the more complex projects in subsequent courses. To reduce this cost, we use a statistical procedure to select a subset of mutation operators that maintains accuracy while minimizing cost. We show that with only 2 operators, costs can be reduced by a factor of 2&ndash;3 with negligible loss in accuracy. Finally, we evaluate our approach on open-source software and report that our findings may generalize beyond our educational context.
  # blog: 'https://ayaankazerouni.medium.com/fast-and-accurate-incremental-feedback-for-students-software-tests-using-selective-mutation-674bb2fc009c'
  links:
    blog: 'blog/fast-accurate-mutation-feedback'

- id: 'sigcse2021milestones'
  type: 'c'
  topics:
    - self-regulation in programming 
  title: 'The Impact of Programming Project Milestones on Procrastination, Project Outcomes, and Course Outcomes'
  venue: "SIGCSE"
  pub_title: ACM Technical Symposium on Computer Science Education&mdash;Research Track
  authors: 'C. A. Shaffer, <b>A. M. Kazerouni</b>'
  date: '2021-03'
  links:
    talk: 'https://youtu.be/n3E3vMEXhSo'
    # blog: 'https://ayaankazerouni.medium.com/explicit-milestones-on-intermediate-software-projects-are-pretty-not-bad-efc9fd8fd1fe'
    blog: 'blog/explicit-project-milestones'
    slides: 'assets/slides/milestones-sigcse2021-slides.pdf'
  abstract: |
    When faced with a large and complex project for the first time, students face numerous self-regulatory challenges that they may be ill-equipped to overcome. These challenges can result in degraded project outcomes, as commonly observed in programming-intensive mid-level CS courses. We have previously found that success in these situations is associated with a disciplined personal software process. Procrastination is a prominent failure of self-regulation that can occur for a number of reasons, e.g., low expectancy of success, low perceived value of the task at hand, or decision-paralysis regarding how to begin when faced with a large task. It is pervasive, but may be addressed through targeted interventions. We draw on theory related to goal theory and problem-solving in engineering education to evaluate the value of explicit <i>project milestones</i> at curbing procrastination and its negative impacts on relatively long-running software projects. We conduct a quasi-experiment in which we study differences in project and course outcomes between students in a treatment (with milestones) and control group (without milestones). We found that students in the treatment group were more likely to finish their projects on time, produced projects with higher correctness, and finished the course with generally better outcomes. Within the treatment group, we found that students who completed more milestones saw better outcomes than those who completed fewer milestones. We found no differences in withdrawal or failure rates between the treatment and control groups. An end-of-term survey indicated that student perceptions of the milestones were overwhelmingly positive.
  pdf: 'sigcse2021milestones.pdf'
  doi: 'https://doi.org/10.1145/3408877.3432356'

- id: 'koli2020debugging'
  type: 'c'
  title: 'Exploring the Bug Investigation Techniques of Intermediate Student Programmers'
  pub_title: 'Koli Calling International Conference on Computing Education Research'
  venue: "Koli Calling"
  authors: 'R. S. Mansur, <b>A. M. Kazerouni</b>, S. H. Edwards, C. A. Shaffer'
  date: '2020-11'
  pdf: 'koli2020debugging.pdf'
  doi: 'https://doi.org/10.1145/3428029.3428040'
  topics:
    - self-regulation in programming
    - debugging
  abstract: |
    We seek to understand bug investigation practices among intermediate student developers. To this end, we used a mixed-methods approach to study the testing and debugging practices of students in a junior-level, post-CS2 Data Structures course with relatively large projects (4-week lifecycle). First, we interviewed 12 students of varying project performances.  From the interviews, we identified five techniques that students use for both testing and debugging:  1) writing diagnostic print statements, 2) unit testing, 3) using a source-level debugger, 4) submission to an online auto-grader, and 5) manual tracing. Using the Grounded Theory approach, we developed four hypotheses regarding students' use of multiple techniques and their possible impact on performance. We used clickstream data from the IDE (Eclipse) to analyze the level of use of the first four of these bug investigating techniques. We found that over 92%, 87%, and 73% of the students used JUnit testing, diagnostic print statements, and the source-level debugger, respectively. Most of the students (91%) used more than one technique to investigate bugs in their projects. We found a positive correlation between using multiple bug investigation techniques and a higher score in the projects. Finally, we identified some ineffective practices correlated with lower project scores.

- id: 'iticse2020progsnap'
  type: 'c'
  topics:
    - introductory programming 
  title: 'ProgSnap2: A Flexible Format for Programming Process Data'
  pub_title: 'ACM Conference on Innovation and Technology in Computer Science Education&mdash;Tools'
  venue: "ITiCSE"
  authors: 'T. Price, D. Hovemeyer, K. Rivers, A. C. Bart, G. Gao, <b>A. M. Kazerouni</b>, B. Becker, A. Petersen, L. Gusukuma, S. H. Edwards, D. Babcock'
  date: '2020-06'
  pdf: 'iticse20-progsnap2.pdf'
  doi: 'https://doi.org/10.1145/3341525.3387373'
  abstract: |
    In this paper, we introduce ProgSnap2, a standardized format for logging programming process data. ProgSnap2 is a tool for computing education researchers, with the goal of enabling collaboration by helping them to collect and share data, analysis code, and data-driven tools to support students. We give an overview of the format, including how events, event attributes, metadata, code snapshots and external resources are represented. We also present a case study to evaluate how ProgSnap2 can facilitate collaborative research. We investigated three metrics designed to quantify students' difficulty with compiler errors - the Error Quotient, Repeated Error Density and Watwin score - and compared their distributions and ability to predict students' performance. We analyzed five different ProgSnap2 datasets, spanning a variety of contexts and programming languages. We found that each error metric is mildly predictive of students' performance. We reflect on how the common data format allowed us to more easily investigate our research questions.

- id: 'dissertation'
  type: 'd'
  topics:
    - self-regulation in programming
  title: 'Measuring the Software Development Process to Enable Formative Feedback'
  authors: '<b>A. M. Kazerouni</b>'
  date: '2020-04'
  doi: 'https://vtechworks.lib.vt.edu/handle/10919/97723'
  links:
    slides: 'assets/slides/final-defense.pdf'
  pdf: 'dissertation.pdf'
  pub_title: PhD Dissertation
  venue: Virginia Tech
  abstract: |
    Graduating CS students face well-documented difficulties upon entering the workforce, with reports of a gap between what they learn and what is expected of them in industry. Project management, software testing, and debugging have been repeatedly listed as common "knowledge deficiencies" among newly hired CS graduates. Similar difficulties manifest themselves on a smaller scale in upper-level CS courses, like the Data Structures and Algorithms course at Virginia Tech: students are required to develop large and complex projects over a three to four week lifecycle, and it is common to see close to a quarter of the students drop or fail the course, largely due to the difficult and time-consuming nature of the projects. My research is driven by the hypothesis that regular feedback about the software development process, delivered during development, will help ameliorate these difficulties. Assessment of software currently tends to focus on qualities like correctness, code coverage from test suites, and code style. Little attention or tooling has been developed for the assessment of the software development process. I use empirical software engineering methods like IDE-log analysis, software repository mining, and semi-structured interviews with students to identify effective and ineffective software practices to formulate. Using the results of these analyses, I have worked on assessing students' development in terms of time management, test writing, test quality, and other "self-checking" behaviours like running the program locally or submitting to an oracle of instructor-written test cases. The goal is to use this information to formulate formative feedback about the software development process. In addition to educators, this research is relevant to software engineering researchers and practitioners, since the results from these experiments are based on the work of upper-level students who grapple with issues of design and work-flow that are not far removed from those faced by professionals in industry.

- id: 'ase2019'
  type: 'c'
  topics:
    - regexes
  title: 'Testing Regex Generalizability And Its Implications: A Large-Scale Many-Language Measurement Study'
  pub_title: 'International Conference on Automated Software Engineering'
  venue: "ASE"
  authors: "J. C. Davis, D. Moyer, <b>A. M. Kazerouni</b>, D. Lee"
  date: '2019-11'
  pdf: 'regex-generalizability-2019.pdf'
  doi: 'https://doi.org/10.1109/ASE.2019.00048'
  abstract: |
    The regular expression (regex) practices of software engineers affect the maintainability, correctness, and security of their software applications. Empirical research has described characteristics like the distribution of regex feature usage, the structural complexity of regexes, and worst-case regex match behaviors. But researchers have not critically examined the methodology they follow to extract regexes, and findings to date are typically generalized from regexes written in only 1-2 programming languages. This is an incomplete foundation. Generalizing existing research depends on validating two hypotheses: (1) Various regex extraction methodologies yield similar results, and (2) Regex characteristics are similar across programming languages. To test these hypotheses, we defined eight regex metrics to capture the dimensions of regex representation, string language diversity, and worst-case match complexity. We report that the two competing regex extraction methodologies yield comparable corpuses, suggesting that simpler regex extraction techniques will still yield sound corpuses. But in comparing regexes across programming languages, we found significant differences in some characteristics by programming language. Our findings have bearing on future empirical methodology, as the programming language should be considered, and generalizability will not be assured. Our measurements on a corpus of 537,806 regexes can guide data-driven designs of a new generation of regex tools and regex engines.

- id: 'icer2019dc'
  type: 'o'
  title: 'Toward Continuous Assessment of the Programming Process &mdash; Doctoral Consortium'
  pub_title: 'ACM International Computing Education Research Conference&mdash;Doctoral Consortium'
  venue: "ICER"
  authors: "<b>A. M. Kazerouni</b>"
  date: '2019-08'
  topics:
    - self-regulation in programming
  pdf: 'icer-dc.pdf'
  doi: 'https://doi.org/10.1145/3291279.3339429'
  abstract: |
    Assessment of software tends to focus on postmortem evaluation of metrics like correctness, mergeability, and code coverage. This is evidenced in the current practices of continuous integration and deployment that focus on software's ability to pass unit tests before it can be merged into a deployment pipeline. However, little attention or tooling is given to the assessment of the software development process itself. Good process becomes both more challenging and more critical as software complexity increases. Real-time evaluation and feedback about a student's software development skills, such as incremental development, testing, and time management, could greatly increase productivity and improve the ability to write tested and correct code. In my research, I develop models to quantify a student's programming process in terms of these metrics. By measuring the programming process, I can empirically evaluate its adherence to known best practices in software engineering. With the ability to characterize this, I can build tools to provide them with intelligent and timely feedback when they are in danger of straying from those practices. In the long term, I hope to contribute to the standardization and adoption of continuous software assessment techniques that include not only the final product, but also the process undertaken to produce it.

- id: 'sigcse2019paper'
  type: 'c'
  title: "Assessing Incremental Testing Practices and Their Impact on Project Outcomes"
  pub_title: 'ACM Technical Symposium on Computer Science Education&mdash;Research Track'
  venue: "SIGCSE"
  award: "2nd Best Research Paper"
  authors: "<b>A. M. Kazerouni</b>, C. A. Shaffer, S. H. Edwards, F. Servant"
  date: '2019-02'
  topics:
    - self-regulation in programming
    - software testing
  pdf: 'assessing-incremental-testing.pdf'
  doi: 'https://doi.org/10.1145/3287324.3287366'
  links:
    code: 'https://github.com/ayaankazerouni/incremental-testing'
    # blog: 'https://medium.com/@ayaankazerouni/assessing-incremental-testing-practices-a25a7cf9108?source=friends_link&sk=4c8ae01da6474d651204fca59f12bc09'
    blog: 'blog/assessing-incremental-testing'
    slides: 'assets/slides/assessing-incremental-testing-slides.pdf'
  key: true
  abstract: |
    Software testing is an important aspect of the development process, one that has proven to be a challenge to formally introduce into the typical undergraduate CS curriculum. Unfortunately, existing assessment of testing in student software projects tends to focus on evaluation of metrics like code coverage over the finished software product, thus eliminating the possibility of giving students early feedback as they work on the project. Furthermore, assessing and teaching the process of writing and executing software tests is also important, as shown by the multiple variants proposed and disseminated by the software engineering community, e.g., test-driven development (TDD) or incremental test-last (ITL). We present a family of novel metrics for assessment of testing practices for increments of software development work, thus allowing early feedback before the software project is finished. Our metrics measure the balance and sequence of effort spent writing software tests in a work increment. We performed an empirical study using our metrics to evaluate the test-writing practices of 157 advanced undergraduate students, and their relationships with project outcomes over multiple projects for a whole semester. We found that projects where more testing effort was spent per work session tended to be more semantically correct and have higher code coverage. The percentage of method-specific testing effort spent before production code did not contribute to semantic correctness, and had a negative relationship with code coverage. These novel metrics will enable educators to give students early, incremental feedback about their testing practices as they work on their software projects.

- id: 'sigcse2019debugging-poster'
  type: 'o'
  title: "Student Debugging Practices and Their Relationships with Project Outcomes &mdash; Poster"
  pub_title: "ACM Technical Symposium on Computer Science Education"
  venue: "SIGCSE"
  date: "2019-02"
  authors: "<b>A. M. Kazerouni</b>, R. S. Mansur, S. H. Edwards, C. A. Shaffer"
  doi: 'https://doi.org/10.1145/3287324.3293794'
  pdf: 'sigcse2019debugging-poster.pdf'
  topics:
      - self-regulation in programming
      - debugging
  abstract: |
    Debugging is an important part of the software development process, studied by both the CS education and software engineering communities. Most prior work has focused either on novice or professional programmers. Intermediate-to-advanced students (such as those enrolled in post-CS2 Data Structures courses) who are working on large and complex projects have largely been ignored. We present results from an empirical observational study that examined junior-level undergraduate students' debugging practices on relatively large (4-week lifecycle) projects, using IDE clickstream data collected by a custom Eclipse plugin. Specifically, we hypothesize that there are differing debugging behaviors exhibited, and that differing behaviors lead to differing project out-comes. For example, how often do students use the symbolic debugger available in modern IDEs, versus how often do they use diagnostic print statements, or both? What triggers a debugging session? What follows a debugging session? Does it matter when in the project lifecycle that debugging takes place? We have a number of interesting preliminary results. When using the debugger, there was a negative relationship between step-over and step-into actions versus final course grades, indicating that when students "spin their wheels" while debugging, they tend to perform more poorly. Students also tend to perform better on the project when debugging takes place earlier in the overall project life-cycle. We developed an algorithm to identify diagnostic print statements in the students' projects. We found that over 90% used at least one diagnostic print statement, and about 75% used the symbolic debugger, at least once in any given project.

- id: 'comped2019paper'
  type: 'c'
  title: "The Relationship Between Practicing Short Programming Exercises and Exam Performance"
  date: '2019-05'
  topics:
    - introductory programming
  pub_title: "ACM Global Computing Education Conference"
  venue: "CompEd"
  pdf: 'codeworkout-comped-2019.pdf'
  doi: 'https://doi.org/10.1145/3300115.3309525'
  authors: "S. H. Edwards, K. P. Murali, <b>A. M. Kazerouni</b>"
  key: true
  abstract: |
    Learning to program can be challenging. Many instructors use drill-and-practice strategies to help students develop basic programming techniques and improve their confidence. Online systems that provide short programming exercises with immediate, automated feedback are seeing more frequent use in this regard. However, the relationship between practicing with short programming exercises and performance on larger programming assignments or exams are unclear. This paper describes an evaluation of short programming questions in the context of a CS1 course where they were used on both homework assignments, for practice and learning, and on exams, for assessing individual performance. The open-source drill-and-practice system used here provides for full feedback during practice exercises. During exams, it allows limiting feedback to compiler errors and to a very small number of example inputs shown in the question, instead of the more complete feedback received during practice. Using data collected from 200 students in a CS1 course, we examine the relationship between voluntary practice on short exercises and subsequent performance on exams, while using an early exam as a control for individual differences including ability level. Results indicate that, after controlling for ability, voluntary practice does contribute to improved performance on exams, but that motivation to improve may also be important.

- id: 'sigcse2018poster'
  type: 'o'
  title: "Toward Continuous Assessment of the Programming Process &mdash; Student Research Competition"
  pub_title: "ACM Technical Symposium on Computer Science Education&mdash;Student Research Competition"
  venue: "SIGCSE"
  authors: "<b>A. M. Kazerouni</b>"
  award: "1st Place"
  date: '2018-02'
  topics:
    - self-regulation in programming
  doi: 'https://doi.org/10.1145/3159450.3162337'
  pdf: 'sigcse-src-2018-poster.pdf'
  links:
    slides: 'assets/slides/sigcse2018-src-slides.pdf'
  abstract: |
    Assessment of software tends to focus on postmortem evaluation of metrics like correctness, mergeability, and code coverage. This is evidenced in the current practices of continuous integration and deployment that focus on software's ability to pass unit tests before it can be merged into a deployment pipeline. However, little attention or tooling is given to the assessment of the software development process itself. Good process becomes both more challenging and more critical as software complexity increases. Real-time evaluation and feedback about a software developer's skills, such as incremental development, testing, and time management, could greatly increase productivity and improve the ability to write tested andcorrect code. My work focuses on the collection and analysis of fine-grained programming process data to help quantitatively model the programming process in terms of these metrics. I report on my research problem, presenting past work involving the collection and analysis of IDE event data from junior level students working on large and complex projects. The goal is to quantify the programming process in terms of incremental development and procrastination. I also present a long-term vision for my research and present work planned in the short term as a step toward that vision.

- id: 'icer2017paper'
  type: 'c'
  title: "Quantifying Incremental Development Practices and Their Relationship to Procrastination"
  date: '2017-08'
  topics:
    - self-regulation in programming
  pub_title: "ACM International Computing Education Research Conference"
  venue: "ICER"
  pdf: 'quantifying-incremental-development-procrastination.pdf'
  doi: 'https://doi.org/10.1145/3105726.3106180'
  authors: "<b>A. M. Kazerouni</b>, S. H. Edwards, C. A. Shaffer"
  links:
    code: 'https://github.com/ayaankazerouni/sensordata'
    # blog: 'https://medium.com/@ayaankazerouni/developing-procrastination-feedback-for-student-software-developers-1652de60db7f'
    blog: 'blog/procrastination-feedback'
  key: true
  abstract: |
    We present quantitative analyses performed on character-level program edit and execution data, collected in a junior-level data structures and algorithms course. The goal of this research is to determine whether proposed measures of student behaviors such as incremental development and procrastination during their program development process are significantly related to the correctness of final solutions, the time when work is completed, or the total time spent working on a solution. A dataset of 6.3 million fine-grained events collected from each student's local Eclipse environment is analyzed, including the edits made and events such as running the program or executing software tests. We examine four primary metrics proposed as part of previous work, and also examine variants and refinements that may be more effective. We quantify behaviors such as working early and often, frequency of program and test executions, and incremental writing of software tests. Projects where the author had an earlier mean time of edits were more likely to submit their projects earlier and to earn higher scores for correctness. Similarly earlier median time of edits to software tests was also associated with higher correctness scores. No significant relationships were found with incremental test writing or incremental checking of work using either interactive program launches or running of software tests, contrary to expectations. A preliminary prediction model with 69% accuracy suggests that the underlying metrics may support early prediction of student success on projects. Such metrics also can be used to give targeted feedback to help students improve their development practices.

- id: 'iticse2017paper'
  type: 'c'
  date: '2017-06'
  topics:
    - self-regulation in programming
  title: "DevEventTracker: Tracking development events to assess incremental development and procrastination"
  pub_title: "ACM Conference on Innovation and Technology in Computer Science Education"
  venue: "ITiCSE"
  pdf: 'deveventtracker.pdf'
  doi: 'https://doi.org/10.1145/3059009.3059050'
  authors: "<b>A. M. Kazerouni</b>, S. H. Edwards, T. S. Hall, C. A. Shaffer"
  links:
    code: 'https://github.com/web-cat/eclipse-plugins-importer-exporter/tree/DevEventTrackerAddition'
    # blog: 'https://medium.com/@ayaankazerouni/developing-procrastination-feedback-for-student-software-developers-1652de60db7f'
    blog: 'blog/procrastination-feedback'
  abstract: |
    Good project management practices are hard to teach, and hard for novices to learn. Procrastination and bad project management practice occur frequently, and may interfere with successfully completing major programming projects in mid-level programming courses. Students often see these as abstract concepts that do not need to be actively applied in practice. Changing student behavior requires changing how this material is taught, and more importantly, changing how learning and practice are assessed. To provide proper assessment, we need to collect detailed data about how each student conducts their project development as they work on solutions. We present DevEventTracker, a system that continuously collects data from the Eclipse IDE as students program, giving us in-depth insight into students' programming habits. We report on data collected using DevEventTracker over the course of four programming projects involving 370 students in five sections of a Data Structures and Algorithms course over two semesters. These data support a new measure for how well students apply "incremental development" practices. We present a detailed description of the system, our methodology, and an initial evaluation of our ability to accurately assess incremental development on the part of the students. The goal is to help students improve their programming habits, with an emphasis on incremental development and time management.
