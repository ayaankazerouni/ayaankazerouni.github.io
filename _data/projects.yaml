- name: Inkling
  image: inkling.jpg
  alt: The Inkling editor, with a code editor, a hand-drawn heatmap sketch, and a natural language prompt
  description: >
    A prototype visualization editor where you can sketch, describe, and code
    your way to a chart that's bound to your data. A research project with
    students at Cal Poly.
  links:
    - text: Visit
      url: https://inkling-vis.netlify.app
    - text: Source
      url: https://github.com/Cal-Poly-Human-Centered-Computing/inkling
    - text: Research
      url: /research
- name: Code Review
  image: code-review.jpg
  alt: The code review tool showing a Java file with highlighted lines and review comments
  description: >
    A browser-only tool for leaving comments on a codebase and exporting them
    as a standalone HTML file. I made it mostly for myself, so it's
    keyboard-driven according to my own preferences.
  links:
    - text: Visit
      url: https://ayaankazerouni.org/code-review/
    - text: Source
      url: https://github.com/ayaankazerouni/code-review
