<style>
figure.wide {
  overflow-x: visible;
  max-width: 120%;
}

figure.wide img {
  max-width: 120%;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

figure.wrap {
  float: left;
}

figure.wrap img {
  max-width: 40vw;
}

figure.wrap figcaption {
  max-width: 20vw;
}

figure.wrap img,
figure.wrap figcaption {
  margin-right: 5vw;
}

@media only screen and (max-width: 768px) {
  figure.wrap {
    float: unset;
  }

  figure.wrap img,
  figure.wrap figcaption {
    max-width: 95vw;
  }
}
</style>

{% assign image_path = page.url | remove: page.name | append: include.url %}
{% if include.wide %}
<figure class="wide">
  <a href="{{ image_path | absolute_url }}" target="_blank">
    <img src="{{ image_path | absolute_url }}" alt="{{ include.alt }}" />
  </a>
{% elsif include.wrap %}
<figure class="wrap">
  <a href="{{ image_path | absolute_url }}" target="_blank">
    {% if include.width %}
    <img src="{{ image_path | absolute_url }}" alt="{{ include.alt }}" width="{{ include.width }}" />
    {% else %}
    <img src="{{ image_path | absolute_url }}" alt="{{ include.alt }}" width="400" />
    {% endif %}
  </a>
{% else %}
<figure>
  <a href="{{ image_path | absolute_url }}" target="_blank">
    {% if include.width %}
    <img src="{{ image_path | absolute_url }}" alt="{{ include.alt }}" width="{{ include.width }}" />
    {% else %}
    <img src="{{ image_path | absolute_url }}" alt="{{ include.alt }}" />
    {% endif %}
  </a>
{% endif %}
  <figcaption>{{ include.description }}</figcaption>
</figure>
